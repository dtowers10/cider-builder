<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23000'/><g fill='%23161616'><rect x='5' y='5' width='26' height='26' rx='6'/><rect x='33' y='5' width='26' height='26' rx='6'/><rect x='5' y='33' width='26' height='26' rx='6'/><rect x='33' y='33' width='26' height='26' rx='6'/></g><g transform='translate(6 6) scale(1)' fill='%23ededed'><path d='M12 7C9 5.5 4.5 6.5 4.5 12 4.5 17 8 21.5 10 21.5 11 21.5 11.3 21 12 21S13 21.5 14 21.5C16 21.5 18.5 18 19.3 15.8 17.5 15 16.5 13.5 16.5 11.8S17.3 9 18.5 8.2C17.5 6.8 15.8 6.3 14.6 6.4 13.6 6.5 12.8 7 12 7Z'/><path d='M12.2 5.8C12.2 4 13.6 2.6 15.4 2.5 15.4 4.3 14 5.8 12.2 5.8Z'/></g><g transform='translate(46 22)' fill='%233ddc84' stroke='%233ddc84' stroke-linecap='round'><path d='M-9 4A9 9 0 0 1 9 4Z' stroke='none'/><path d='M-5.5 -4.2L-8 -8.5M5.5 -4.2L8 -8.5' stroke-width='1.8' fill='none'/><circle cx='-4' cy='0' r='1.3' fill='%23161616' stroke='none'/><circle cx='4' cy='0' r='1.3' fill='%23161616' stroke='none'/></g><path d='M10 53L18 39.5 26 53' fill='none' stroke='%23ededed' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/><g transform='translate(46 46)' fill='none' stroke='%2361dafb' stroke-width='1.6'><ellipse rx='10' ry='3.8'/><ellipse rx='10' ry='3.8' transform='rotate(60)'/><ellipse rx='10' ry='3.8' transform='rotate(120)'/><circle r='2' fill='%2361dafb' stroke='none'/></g></svg>">
<title>Cider Builder · panel</title>
<style>
@font-face { font-family: "Geist"; src: url("/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  color-scheme: dark;
  --bg: #000000; --fg: #ededed; --muted: #8f8f8f; --line: #1f1f1f; --hover: #0f0f0f; --strong: #3a3a3a;
  --ok: #4ade80; --warn: #facc15; --bad: #f87171; --info: #a78bfa; --idle: #6b6b6b; --run: #60a5fa;
  --bar: 48px;
  --sans: "Geist", system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 64px; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: underline; text-decoration-color: var(--strong); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
button { background: transparent; border: 1px solid var(--strong); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--fg); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.danger { color: var(--bad); border-color: currentColor; }
button.danger:hover:not(:disabled) { background: var(--bad); color: var(--bg); border-color: var(--bad); }
input, select { background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; min-width: 0; }
input:hover, select:hover { border-color: var(--strong); }
.mono, code, pre, table, .kv dd, .conn, .toast, .nav-count, .plat, .line2, .log-find, .log-status { font-family: var(--mono); font-size: 12px; }
.mono { font-variant-ligatures: none; }
.muted { color: var(--muted); }
.err { color: var(--bad); }

.bar { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 18px; min-height: var(--bar); padding: 0 24px;
       background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font: 600 14px/1 var(--mono); letter-spacing: -.01em; margin: 0; white-space: nowrap; }
.brand .mono { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-btn { display: none; }
.bar nav ul { display: flex; gap: 2px; list-style: none; margin: 0; padding: 0; }
.bar nav a { display: flex; align-items: center; gap: 8px; padding: 6px 10px; color: var(--muted); text-decoration: none; border-radius: 6px;
             white-space: nowrap; }
.bar nav a:hover { color: var(--fg); background: var(--hover); }
.bar nav a[aria-current="page"] { color: var(--fg); background: #1a1a1a; font-weight: 500; }
.nav-count { display: flex; gap: 10px; font-variant-numeric: tabular-nums; color: var(--muted); }
.nav-count > span { display: inline-flex; align-items: center; gap: 5px; }
.nav-count:empty { display: none; }
.alerts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; min-width: 0; }
.chip { --c: var(--idle); display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono); white-space: nowrap; color: var(--fg);
        border: 1px solid var(--strong); border-radius: 999px; padding: 1px 8px; text-decoration: none; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); flex: none; }
.chip:hover { border-color: var(--fg); }
.chip.bad { --c: var(--bad); }
.chip.warn { --c: var(--warn); }
.chip.info { --c: var(--info); }
.alerts-n { display: none; }
.conn { display: flex; flex: none; align-items: center; gap: 7px; color: var(--muted); white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--idle); }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--bad); }
.dot.warn { background: var(--warn); }
.dot.out { background: var(--info); }
.dot.run { background: var(--run); }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.banner { color: var(--bad); padding: 8px 24px; border-top: 1px solid var(--bad); border-bottom: 1px solid var(--bad); font-weight: 500; }
main { padding: 28px 24px 64px; max-width: 1400px; margin: 0 auto; }
section { margin-bottom: 48px; }
h2 { font-size: 13px; font-weight: 600; margin: 0 0 14px; }
h3 { font-size: 13px; font-weight: 500; margin: 26px 0 10px; color: var(--muted); }
h2 + h3 { margin-top: 0; }

.board { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.board-side { min-width: 0; }
.board h3:first-child { margin-top: 0; }
#board-recent { margin-top: 26px; }
.lanes { border-top: 1px solid var(--line); }
.lane { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.lane-who { min-width: 0; }
.lane-who .mono { font-weight: 600; }
.lane-who .muted { margin-top: 4px; }
.cells { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.cell { border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; min-width: 0; }
.cell.job { cursor: pointer; }
.cell.job:hover { background: var(--hover); }
.cell.free, .cell.off, .cell.ghost { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 6px;
                                     border-style: dashed; color: var(--muted); text-align: center; }
.cell .meter { margin: 8px 0 6px; }
.meter { height: 2px; background: var(--line); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--fg); }
.meter span.full { background: var(--warn); }
.long { color: var(--warn); }
.who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; min-width: 0; }
.who b { font-weight: 600; }
.plat { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.line2 { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; margin-top: 4px; color: var(--muted); }
.items { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.items li { padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.items li:hover { background: var(--hover); }
.est { color: var(--muted); margin: 0 0 10px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); border-top: 1px solid var(--line);
         border-left: 1px solid var(--line); }
.card { display: block; padding: 16px 18px; cursor: pointer; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.card:hover { background: var(--hover); }
.cards > .empty { grid-column: 1 / -1; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 14px 18px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card-head strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-line { color: var(--muted); margin-top: 6px; }
.attn { border: 1px solid var(--info); border-radius: 4px; padding: 8px 12px; margin-bottom: 14px; }
.attn:empty { display: none; }
.attn p { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 4px 0; }
.attn p > span:first-child { flex: 1; }
.jump { margin: 0 0 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 14px 0 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

.badge { --c: var(--idle); display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono); white-space: nowrap; color: var(--fg); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); flex: none; }
.b-online, .b-done { --c: var(--ok); }
.b-no_tools, .b-nosrc { --c: var(--warn); }
.b-drained, .b-pending { --c: var(--info); }
.b-stale, .b-failed { --c: var(--bad); }
.b-assigned, .b-building, .b-updating { --c: var(--run); }

.tablewrap { overflow-x: auto; border-top: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 7px 14px 7px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 500 12px var(--sans); color: var(--muted); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--hover); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.empty { padding: 10px 0; color: var(--muted); border-top: 1px solid var(--line); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.filters input[type=search] { flex: 1 1 240px; }
.filters .count { margin-left: auto; color: var(--muted); font: 12px var(--mono); }
.seg { display: inline-flex; gap: 4px; margin: 0; padding: 0; border: 0; min-width: 0; }
.opt { border: 1px solid var(--strong); border-radius: 999px; padding: 1px 9px; cursor: pointer; }
.opt:hover { border-color: var(--fg); }
.opt:has(:checked) { border-color: var(--fg); background: var(--hover); }
.opt:has(:focus-visible) { outline: 2px solid var(--fg); outline-offset: 2px; }
.cache { table-layout: fixed; min-width: 620px; }
.cache col.c-plat { width: 84px; } .cache col.c-size { width: 84px; } .cache col.c-used { width: 156px; } .cache col.c-act { width: 196px; }
.cache td.ver { overflow: hidden; text-overflow: ellipsis; }
.cache th:last-child, .cache td:last-child { padding-right: 0; text-align: right; }
.cache .proj-head th, .cache .proj-head td { padding: 22px 14px 8px 0; font: 600 13px var(--sans); color: var(--fg); }
.cache tbody:first-of-type .proj-head th, .cache tbody:first-of-type .proj-head td { padding-top: 12px; }
.cache .proj-head td { padding-right: 0; }
.cache .proj-head .mono { font-size: 13px; }
.cache .proj-head .muted { font-weight: 400; margin-left: 10px; }
.cache tr.file:hover td { background: var(--hover); }
.cache td .quiet + .quiet { margin-left: 2px; }
.quiet { display: inline-block; border: 1px solid transparent; border-radius: 4px; padding: 3px 8px; color: var(--muted); text-decoration: none;
         font: 500 12px var(--sans); line-height: 1.5; }
.quiet:hover:not(:disabled) { color: var(--fg); border-color: var(--strong); }
.quiet.danger { color: var(--muted); border-color: transparent; }
.quiet.danger:hover:not(:disabled), .quiet.danger:focus-visible { color: var(--bad); border-color: var(--bad); background: transparent; }
h2[tabindex="-1"]:focus { outline: none; }

.cmd { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
.cmd code { flex: 1; display: block; padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; overflow-x: auto; white-space: pre; }
.note { color: var(--muted); margin: 14px 0 0; max-width: 72ch; }

.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); z-index: 9; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(820px, 100vw); z-index: 10; background: var(--bg);
          border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.drawer.wide { width: min(1100px, 100vw); }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { flex: 1; margin: 0; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer-body { overflow-y: auto; padding: 18px 20px 40px; flex: 1; }
.drawer-body.job { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 18px; }
.drawer .kv { grid-template-columns: minmax(130px, auto) 1fr; margin: 0; }
.drawer .note { margin: 0 0 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0; }
.toolbar input[type=number] { width: 72px; font-family: var(--mono); }
.hint { color: var(--muted); }
.job-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.job-head .details { margin-left: auto; }
#job-more { padding: 10px 0; border-bottom: 1px solid var(--line); }
.log-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
.log-tools input[type=search] { flex: 1 1 160px; }
.log-find, .log-status { color: var(--muted); }
.log-tools .log-status { margin-left: auto; }
pre.log { margin: 0; padding: 12px 14px; max-height: 62vh; min-height: 120px; overflow: auto; background: var(--hover); color: var(--fg);
          border: 1px solid var(--line); border-radius: 4px; font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.job pre.log { flex: 1; min-height: 0; max-height: none; }
pre.log.nowrap { white-space: pre; overflow-wrap: normal; }
::highlight(log-hit) { background-color: var(--strong); }
::highlight(log-cur) { background-color: var(--warn); color: var(--bg); }

dialog { border: 1px solid var(--strong); border-radius: 6px; padding: 20px 22px; background: var(--bg); color: var(--fg);
         max-width: min(500px, 94vw); }
dialog::backdrop { background: rgba(0, 0, 0, .7); }
dialog h2 { margin-bottom: 12px; }
dialog p { margin: 0 0 8px; }
dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column;
          gap: 6px; width: min(560px, 94vw); }
.toast { background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.toast.bad { background: var(--bad); color: #000; }
@media (max-width: 860px) {
  .bar { gap: 10px; padding: 10px 16px; }
  .brand { flex: 1; }
  .alerts { order: 1; margin-left: 0; flex-wrap: nowrap; }
  .alerts .chip:not(.alerts-n), .alerts .muted { display: none; }
  .alerts .alerts-n { display: inline-flex; }
  .conn { order: 2; }
  #conntext { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .menu-btn { display: block; order: 3; }
  .bar nav { display: none; position: absolute; top: 100%; left: 0; right: 0; max-height: calc(100vh - 52px); overflow-y: auto;
             padding: 12px 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar.open nav { display: block; }
  .bar nav ul { flex-direction: column; }
  .board, .lane { grid-template-columns: minmax(0, 1fr); }
  .cell.free { display: none; }
  .tablewrap table, .tablewrap thead, .tablewrap tbody, .tablewrap tr, .tablewrap th, .tablewrap td { display: block; }
  .tablewrap thead { display: none; }
  .tablewrap tr { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .tablewrap th, .tablewrap td { border: 0; padding: 0; white-space: normal; text-align: left; }
  .cache { min-width: 0; }
  .cache .proj-head th, .cache .proj-head td { padding: 14px 0 0; }
  .tablewrap td::before { content: attr(data-l) ": "; color: var(--muted); }
  .tablewrap td:empty { display: none; }
  .tablewrap td[data-l=""]::before { content: none; }
  .drawer.wide { width: 100vw; }
}
@media (max-width: 560px) {
  main { padding: 20px 14px 48px; }
  .cards { grid-template-columns: 1fr; }
  .drawer .kv { grid-template-columns: 1fr; }
  .drawer .kv dt { margin-top: 6px; }
}
</style>
</head>
<body>
<header id="bar" class="bar">
  <div class="brand"><h1>Cider Builder</h1><span id="hubname" class="mono"></span></div>
  <button id="menu-btn" class="menu-btn" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
  <nav id="nav" aria-label="Views"></nav>
  <div id="summary" class="alerts" aria-label="Alerts"></div>
  <div class="conn"><span id="conndot" class="dot"></span><span id="conntext">connecting…</span></div>
</header>
<div id="banner" class="banner" role="alert" hidden></div>
<main>
  <section id="view-board" hidden>
    <div class="board">
      <div id="board-lanes"></div>
      <div class="board-side">
        <div id="board-queue"></div>
        <div id="board-recent"></div>
        <p class="note"><a href="#/history">All history</a> · <a id="board-failures" href="#/history">Failures in History</a></p>
      </div>
    </div>
  </section>
  <section id="view-history" hidden>
    <div class="filters">
      <input id="f-q" type="search" placeholder="Search id, project, key, client or Mac" aria-label="Search">
      <fieldset id="f-when" class="seg"><legend class="sr">Finished in</legend></fieldset>
      <label class="opt"><input class="sr" type="checkbox" id="f-failed">Failed</label>
      <select id="f-state" aria-label="State">
        <option value="">all states</option><option value="done">done</option><option value="failed">failed</option><option value="cancelled">cancelled</option>
      </select>
      <select id="f-plat" aria-label="Platform"></select>
      <select id="f-mac" aria-label="Mac"></select>
      <select id="f-client" aria-label="Client"></select>
      <span id="f-count" class="count"></span>
    </div>
    <div id="histlist"></div>
  </section>
  <section id="view-fleet" hidden>
    <p class="jump"><a href="#/updates">Updates</a> · <a href="#/add">Add a Mac</a></p>
    <div id="fleet-banner" class="attn"></div>
    <div id="maclist" class="cards"></div>
    <h3 id="fleet-updates" tabindex="-1">Updates</h3><div id="up-hub"></div>
    <h3 id="fleet-add" tabindex="-1">Add a Mac</h3><div id="join"></div>
  </section>
  <section id="view-cache" hidden><h3>Cache</h3><div id="cachelist"></div><h3>Affinity</h3><div id="afflist"></div></section>
</main>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head"><h2 id="drawer-title"></h2><button id="drawer-close" type="button" aria-label="Close">Close</button></div>
  <div id="drawer-body" class="drawer-body"></div>
</aside>
<dialog id="confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title"></h2>
  <div id="confirm-body"></div>
  <div class="actions"><button id="confirm-no" type="button">Keep it</button><button id="confirm-yes" type="button" class="danger"></button></div>
</dialog>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<script>
"use strict";
const POLL_MS = 2000, MIN_MS = 1000, MAX_BACKOFF_MS = 10000, CACHE_MS = 30000;
const LOG_TAIL = 1 << 20, LOG_CAP = 4e6, HISTORY_ROWS = 500, LOG_HITS_MAX = 1000;
const ACTIVE = ["queued", "assigned", "building"];
const DAY = 86400, RECENT_ROWS = 10, RECENT_STATES = ["done", "failed"], MIN_SAMPLES = 2;
const SOURCE_TTL = 120;
const $ = (id) => document.getElementById(id);
const enc = encodeURIComponent;

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "on") { for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn); continue; }
    if (/^on|^style$|^srcdoc$/i.test(k)) throw new Error("attribute not allowed: " + k);
    if (k === "href" && !/^(#|\/cache\/)/.test(v)) throw new Error("link not allowed: " + v);
    if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
