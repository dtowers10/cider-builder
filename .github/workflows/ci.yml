name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Find scripts by shebang
        run: |
          git ls-files -z | xargs -0 awk 'FNR == 1 { if (/^#!.*bash/) print FILENAME > "/tmp/sh"; else if (/^#!.*python/) print FILENAME > "/tmp/py"; nextfile }'
          cat /tmp/sh /tmp/py
      - name: bash -n
        run: xargs -n1 bash -n < /tmp/sh
      - name: shellcheck
        run: xargs shellcheck --severity=warning < /tmp/sh
      - name: py_compile with Python 3.9
        run: xargs python -m py_compile < /tmp/py
      - name: verification matches the code
        run: python verification/lanes.py --check
      - name: no tailnet names but example.ts.net
        run: "! git grep -noE '[A-Za-z0-9.-]+[.]ts[.]net' | grep -vE ':([A-Za-z0-9.-]*[.])?example[.]ts[.]net$'"

  tla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v6
        with:
          path: verification/tools/tla2tools.jar
          key: tla2tools-${{ hashFiles('verification/verify.sh') }}
          # verify.sh checks the jar's sha256 and downloads it again if it does not match.
          restore-keys: tla2tools-
      - run: verification/verify.sh

  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: python verification/hub-config.py
      - run: python verification/hub-smoke.py
      - run: python verification/install-client.py
      - run: python verification/install-hub.py
      - run: python verification/hub-run-matches-attempt.py
      - run: python verification/run-order.py
      - run: python verification/source-delta.py
      - run: python verification/hub-update.py
      - run: python verification/waiter-ttl.py
      - run: python verification/source-ttl.py
      - run: python verification/warm-upload.py
